<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profesor – Aula Virtual</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f3f4f6;
      color: #1f2937;
      margin: 0;
      padding: 0;
    }
    .app-layout {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      min-height: 100vh;
      box-shadow: 0 0 40px rgba(0,0,0,0.05);
      padding: 1.5rem;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    header h1 { font-size: 1.25rem; font-weight: 700; margin: 0; }
    .btn-back { color: #ef4444; text-decoration: none; font-weight: 600; }
    
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.4rem; color: #374151; }
    input[type="text"], select, textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.9rem;
      box-sizing: border-box;
    }
    textarea { height: 100px; resize: vertical; }
    
    .btn-submit {
      width: 100%;
      background: #4f46e5;
      color: white;
      border: none;
      padding: 0.85rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: #4338ca; }
  </style>
</head>
<body>

<div class="app-layout">
  <header>
    <h1>Panel del Profesor</h1>
    <a href="index.html" class="btn-back">🚪 Salir</a>
  </header>

  <form id="postForm">
    <div class="form-group">
      <label for="subjectSelect">Materia</label>
      <select id="subjectSelect">
        <option value="Generales">📢 Avisos Generales</option>
        <option value="Matemáticas">📐 Matemáticas</option>
        <option value="Lengua Española">📚 Lengua Española</option>
        <option value="Ciencias Sociales">🌍 Ciencias Sociales</option>
        <option value="Ciencias Naturales">🌱 Ciencias Naturales</option>
        <option value="Cívica">⚖️ Cívica</option>
        <option value="Informática">💻 Informática</option>
        <option value="Artística">🎨 Artística</option>
        <option value="Inglés">🗣️ Inglés</option>
        <option value="Francés">🥖 Francés</option>
      </select>
    </div>

    <div class="form-group">
      <label for="pointsSelect">Recompensa en Puntos (⭐)</label>
      <select id="pointsSelect">
        <option value="0">Sin puntos (Solo anuncio)</option>
        <option value="5">⭐ +5 Pts</option>
        <option value="10">⭐ +10 Pts</option>
        <option value="15">⭐ +15 Pts</option>
        <option value="20">⭐ +20 Pts</option>
        <option value="25">⭐ +25 Pts</option>
        <option value="50">⭐ +50 Pts</option>
      </select>
    </div>

    <div class="form-group">
      <label for="postText">Indicaciones de la tarea o anuncio</label>
      <textarea id="postText" placeholder="Escribe las instrucciones aquí..." required></textarea>
    </div>

    <div class="form-group">
      <label for="postFileUrl">Enlace de Imagen/Adjunto (Opcional)</label>
      <input type="text" id="postFileUrl" placeholder="https://ejemplo.com/archivo.png"/>
    </div>

    <button type="submit" class="btn-submit" id="publishBtn">🚀 Publicar Tarea</button>
  </form>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBynAiyunaie-L49lT_mJ3W7SiQRB9sDVw",
    authDomain: "clases-68cf1.firebaseapp.com",
    projectId: "clases-68cf1",
    storageBucket: "clases-68cf1.firebasestorage.app",
    messagingSenderId: "734322078138",
    appId: "1:734322078138:web:66ddaaab8b05ffe1996d83"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  const postForm = document.getElementById('postForm');
  const publishBtn = document.getElementById('publishBtn');

  postForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const materia = document.getElementById('subjectSelect').value;
    const puntos = parseInt(document.getElementById('pointsSelect').value, 10) || 0;
    const texto = document.getElementById('postText').value;
    const archivoUrl = document.getElementById('postFileUrl').value;

    publishBtn.disabled = true;
    publishBtn.textContent = "Publicando...";

    try {
      await addDoc(collection(db, 'publicaciones'), {
        autor: 'Profesor',
        materia: materia,
        puntos: puntos,
        texto: texto,
        archivoUrl: archivoUrl || null,
        timestamp: serverTimestamp()
      });

      alert("✅ Tarea publicada correctamente");
      postForm.reset();
    } catch (error) {
      console.error("Error al publicar:", error);
      alert("Hubo un error al guardar la publicación.");
    } finally {
      publishBtn.disabled = false;
      publishBtn.textContent = "🚀 Publicar Tarea";
    }
  });
</script>

</body>
</html>
